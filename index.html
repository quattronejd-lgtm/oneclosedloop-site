<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Closed Loop — the story so far</title>
<meta property="og:title" content="One Closed Loop — the story so far">
<meta property="og:description" content="Every dispatch, one scroll. The ring closes as you read.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Hanken+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1A1330;--ink-soft:#413A57;--paper:#EAECF0;--card:#F6F4EF;--indigo:#262150;
    --teal:#367A88;--rose:#9E4A6E;--line:#C9CDD8;--line-strong:#A7ADBE;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--body:'Hanken Grotesk',Arial,sans-serif}
  *{box-sizing:border-box;margin:0}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.62}
  .wrap{max-width:680px;margin:0 auto;padding:0 24px}

  /* the ring that closes as you read */
  .ringwrap{position:fixed;top:26px;right:26px;z-index:10}
  .ringwrap svg{width:54px;height:54px;display:block}
  .ringwrap .track{fill:none;stroke:var(--line);stroke-width:3}
  .ringwrap .draw{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;
    stroke-dasharray:150.8;stroke-dashoffset:150.8;transform:rotate(-90deg);transform-origin:50% 50%}
  .ringwrap .dot{fill:var(--rose)}

  header{min-height:82vh;display:flex;flex-direction:column;justify-content:center;padding:70px 0 50px;border-bottom:1px solid var(--line)}
  .mark{width:58px;height:58px;border:3px solid var(--ink);border-radius:50%;position:relative;margin-bottom:34px}
  .mark::after{content:"";position:absolute;width:8px;height:8px;background:var(--rose);border-radius:50%;top:-5px;left:50%;transform:translateX(-50%)}
  .kick{font-family:var(--mono);font-weight:500;font-size:13px;letter-spacing:.14em;color:var(--teal);margin-bottom:14px}
  h1{font-family:var(--mono);font-weight:700;font-size:clamp(34px,7vw,54px);line-height:1.05;letter-spacing:-.01em;margin-bottom:18px}
  .sub{font-weight:300;font-size:20px;color:var(--ink-soft);max-width:44ch;margin-bottom:34px}
  .btn{display:inline-block;font-family:var(--mono);font-weight:500;font-size:15px;background:var(--indigo);color:#fff;text-decoration:none;padding:13px 24px}

  .chapter{position:relative;padding:110px 0 10px;overflow:visible}
  .chapnum{position:absolute;right:-10px;top:30px;font-family:var(--mono);font-weight:700;font-size:150px;color:var(--line);line-height:1;z-index:-1;will-change:transform}
  .chaptitle{font-family:var(--mono);font-weight:500;font-size:14px;letter-spacing:.12em;color:var(--teal);text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:12px}

  .dispatch{background:var(--card);border:1px solid var(--line);padding:44px 46px;margin:44px 0}
  .kicker{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.14em;color:var(--teal);margin-bottom:12px}
  h2{font-family:var(--mono);font-weight:700;font-size:28px;line-height:1.15;letter-spacing:-.01em;margin-bottom:22px}
  .dispatch p{margin-bottom:15px;color:#241C3B}
  .stk{line-height:1.5}
  .ben{font-weight:500;font-size:20px;color:var(--ink);margin-top:22px}
  .sig{font-family:var(--mono);font-size:13px;color:var(--ink-soft);margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}

  .cta{text-align:center;padding:26px 0 60px}
  .cta a{font-family:var(--mono);font-size:14px;color:var(--teal);text-decoration:none;border-bottom:1px solid rgba(54,122,136,.4);padding-bottom:2px}

  footer{border-top:1px solid var(--line);padding:70px 0 90px;text-align:center}
  footer .mark{margin:0 auto 26px}
  footer p{font-family:var(--mono);font-size:14px;color:var(--ink-soft);margin-bottom:26px}

  .empty{padding:120px 0;text-align:center;font-family:var(--mono);color:var(--ink-soft)}
  @media(max-width:640px){.dispatch{padding:30px 24px}.chapnum{font-size:96px;right:0}}
  @media(prefers-reduced-motion:reduce){[data-drift]{transform:none!important}}
</style>
</head>
<body>
<div class="ringwrap" aria-hidden="true"><svg viewBox="0 0 54 54">
  <circle class="track" cx="27" cy="27" r="24"/>
  <circle class="draw" id="ringdraw" cx="27" cy="27" r="24"/>
  <circle class="dot" cx="27" cy="3" r="4"/>
</svg></div>

<div class="wrap">
<header>
  <div class="mark"></div>
  <div class="kick">AWARENESS · AUDIT · ADJUSTMENT · REPEAT</div>
  <h1>One Closed Loop.</h1>
  <p class="sub">The story so far — every dispatch, one scroll. The ring in the corner closes as you read.</p>
  <a class="btn" href="https://read.oneclosedloop.com/subscribe">Get the dispatches →</a>
</header>

<div class="empty">The first dispatch is on its way.</div>

<footer>
  <div class="mark"></div>
  <p>Not a bigger life. A smaller one, done honestly.</p>
  <a class="btn" href="https://read.oneclosedloop.com/subscribe">Subscribe — free →</a>
</footer>
</div>

<script>
  const draw = document.getElementById('ringdraw');
  const C = 150.8;
  function onScroll(){
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const p = max > 0 ? Math.min(1, window.scrollY / max) : 0;
    draw.style.strokeDashoffset = String(C * (1 - p));
    document.querySelectorAll('[data-drift]').forEach((el) => {
      const r = el.getBoundingClientRect();
      el.style.transform = 'translateY(' + ((r.top - window.innerHeight / 2) * 0.12) + 'px)';
    });
  }
  addEventListener('scroll', onScroll, {passive:true});
  onScroll();
</script>
</body>
</html>
